<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 11 · Murmuration</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#1a2340; font-family:system-ui,sans-serif; color:#fff; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
  .back { position:fixed; top:12px; left:12px; z-index:2; color:#fffb; text-decoration:none; font-size:14px; background:#0006; padding:6px 10px; border-radius:8px; }
  .bar { position:fixed; top:12px; right:12px; z-index:2; display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; background:#0006; padding:8px 12px; border-radius:10px; font-size:13px; max-width:calc(100vw - 140px); }
  .bar label { display:flex; align-items:center; gap:6px; }
  .bar input[type=range] { width:80px; }
  .hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); font-size:13px; color:#ffffffaa; text-align:center; width:max-content; max-width:92vw; transition:opacity 1s; pointer-events:none; text-shadow:0 1px 3px #000; }
</style>
</head>
<body>
<a class="back" href="../../">← Calendar</a>
<div class="bar">
  <label>Birds <input id="n" type="range" min="500" max="4000" step="250" value="2500"></label>
  <label>Togetherness <input id="coh" type="range" min="0" max="2" step="0.05" value="1"></label>
  <label>Follow-the-neighbour <input id="ali" type="range" min="0" max="2" step="0.05" value="1"></label>
  <label><input id="hawk" type="checkbox" checked> Hawk attacks</label>
</div>
<canvas id="c"></canvas>
<div class="hint" id="hint">Move your mouse into the flock: you're the hawk. Each bird only watches its 7 nearest neighbours.</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, sky, N = 2500, pos, vel, acc;
const BOX = 22, R = 3.4, SEP = 1.5, MAXN = 7, VMIN = 7, VMAX = 13;
const G = 40, CELL = 3.4, OFF = G * CELL / 2;               // spatial hash for neighbour lookups
const head = new Int32Array(G * G * G), next = new Int32Array(4000);
let camA = 0, hawk = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, mode: 'rest', t: 0 }, mouse = null, time = 0;

function init(n) {
  N = n; pos = new Float32Array(N * 3); vel = new Float32Array(N * 3); acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    for (let k = 0; k < 3; k++) pos[i * 3 + k] = (Math.random() - 0.5) * BOX;
    vel[i * 3] = 8 + Math.random(); vel[i * 3 + 1] = (Math.random() - .5) * 2; vel[i * 3 + 2] = (Math.random() - .5) * 2;
  }
}

function size() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // winter sunset backdrop with a village silhouette, painted once
  sky = document.createElement('canvas'); sky.width = W; sky.height = H; const g = sky.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#16224a'); gr.addColorStop(0.45, '#5b4f86'); gr.addColorStop(0.7, '#e2878a'); gr.addColorStop(0.85, '#ffc47e'); gr.addColorStop(1, '#ffdca0');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = '#fff3c4'; g.shadowColor = '#ffd27a'; g.shadowBlur = 80; g.beginPath(); g.arc(W * 0.72, H * 0.86, H * 0.06, 0, 7); g.fill(); g.shadowBlur = 0;
  g.fillStyle = '#2a1f33';
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W; x += 6) g.lineTo(x, H * 0.9 - Math.sin(x * 0.006) * 14 - Math.sin(x * 0.017) * 6);
  g.lineTo(W, H); g.fill();
  let x = 0;
  while (x < W) {                                      // rooftops, chimneys, a church spire
    const w = 40 + Math.random() * 70, h = 20 + Math.random() * 40, base = H * 0.93;
    g.beginPath(); g.moveTo(x, base); g.lineTo(x, base - h); g.lineTo(x + w / 2, base - h - w * 0.35); g.lineTo(x + w, base - h); g.lineTo(x + w, base); g.fill();
    if (Math.random() < 0.6) g.fillRect(x + w * 0.7, base - h - w * 0.3, 7, w * 0.25);
    if (Math.random() < 0.08) { g.beginPath(); g.moveTo(x + w / 2 - 8, base - h - w * 0.3); g.lineTo(x + w / 2, base - h - w * 0.3 - 80); g.lineTo(x + w / 2 + 8, base - h - w * 0.3); g.fill(); }
    g.fillStyle = '#ffcf6e'; for (let k = 0; k < 2; k++) if (Math.random() < 0.6) g.fillRect(x + 8 + k * w * 0.45, base - h + 10, 7, 9); g.fillStyle = '#2a1f33';
    x += w + Math.random() * 10;
  }
}

function step(dt) {
  head.fill(-1);
  for (let i = 0; i < N; i++) {
    const cx = Math.min(G - 1, Math.max(0, ((pos[i * 3] + OFF) / CELL) | 0)), cy = Math.min(G - 1, Math.max(0, ((pos[i * 3 + 1] + OFF) / CELL) | 0)), cz = Math.min(G - 1, Math.max(0, ((pos[i * 3 + 2] + OFF) / CELL) | 0));
    const c = cx + cy * G + cz * G * G; next[i] = head[c]; head[c] = i;
  }
  const kc = +document.getElementById('coh').value, ka = +document.getElementById('ali').value;
  // a slowly wandering "roost" keeps the flock over the village
  const rx = Math.sin(time * 0.13) * 8, ry = Math.sin(time * 0.21) * 4 + 3, rz = Math.cos(time * 0.17) * 6;
  for (let i = 0; i < N; i++) {
    const px = pos[i * 3], py = pos[i * 3 + 1], pz = pos[i * 3 + 2];
    let sx = 0, sy = 0, sz = 0, ax = 0, ay = 0, az = 0, mx = 0, my = 0, mz = 0, n = 0;
    const cx = ((px + OFF) / CELL) | 0, cy = ((py + OFF) / CELL) | 0, cz = ((pz + OFF) / CELL) | 0;
    search:
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const X = cx + dx, Y = cy + dy, Z = cz + dz;
      if (X < 0 || Y < 0 || Z < 0 || X >= G || Y >= G || Z >= G) continue;
      for (let j = head[X + Y * G + Z * G * G]; j !== -1; j = next[j]) {
        if (j === i) continue;
        const ex = pos[j * 3] - px, ey = pos[j * 3 + 1] - py, ez = pos[j * 3 + 2] - pz, d2 = ex * ex + ey * ey + ez * ez;
        if (d2 > R * R) continue;
        if (d2 < SEP * SEP) { const inv = 1 / (d2 + 0.05); sx -= ex * inv; sy -= ey * inv; sz -= ez * inv; }
        ax += vel[j * 3]; ay += vel[j * 3 + 1]; az += vel[j * 3 + 2];
        mx += ex; my += ey; mz += ez;
        if (++n >= MAXN) break search;              // like real starlings: only ~7 neighbours count
      }
    }
    let fx = sx * 5, fy = sy * 5, fz = sz * 5;
    if (n) {
      fx += (ax / n - vel[i * 3]) * 1.4 * ka + mx / n * 0.8 * kc;
      fy += (ay / n - vel[i * 3 + 1]) * 1.4 * ka + my / n * 0.8 * kc;
      fz += (az / n - vel[i * 3 + 2]) * 1.4 * ka + mz / n * 0.8 * kc;
    }
    { const ex = rx - px, ey = ry - py, ez = rz - pz, d = Math.hypot(ex, ey, ez);   // steer back once you stray from the roost
      if (d > 9) { const k = Math.min(1, (d - 9) / 9) * 0.8; fx += (ex / d * VMAX - vel[i * 3]) * k; fy += (ey / d * VMAX - vel[i * 3 + 1]) * k; fz += (ez / d * VMAX - vel[i * 3 + 2]) * k; } }
    const r2 = px * px + py * py + pz * pz; if (r2 > BOX * BOX) { fx -= px * 0.1; fy -= py * 0.1; fz -= pz * 0.1; }
    if (hawk.mode !== 'rest') {                        // flee the hawk
      const hx = px - hawk.x, hy = py - hawk.y, hz = pz - hawk.z, hd2 = hx * hx + hy * hy + hz * hz;
      if (hd2 < 64) { const s = 60 / (hd2 + 1); fx += hx * s; fy += hy * s; fz += hz * s; }
    }
    acc[i * 3] = fx; acc[i * 3 + 1] = fy; acc[i * 3 + 2] = fz;
  }
  for (let i = 0; i < N; i++) {
    let vx = vel[i * 3] + acc[i * 3] * dt, vy = vel[i * 3 + 1] + acc[i * 3 + 1] * dt, vz = vel[i * 3 + 2] + acc[i * 3 + 2] * dt;
    const s = Math.hypot(vx, vy, vz), c = s > VMAX ? VMAX / s : s < VMIN ? VMIN / s : 1;
    vel[i * 3] = vx * c; vel[i * 3 + 1] = vy * c; vel[i * 3 + 2] = vz * c;
    pos[i * 3] += vel[i * 3] * dt; pos[i * 3 + 1] += vel[i * 3 + 1] * dt; pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
  }
  moveHawk(dt);
}

// camera: orbit slowly around the flock
const camDist = 62;
function project(x, y, z) {
  const c = Math.cos(camA), s = Math.sin(camA);
  const X = x * c - z * s, Z = x * s + z * c;
  const f = Math.min(W, H) * 1.6 / (camDist - Z);
  return [W / 2 + X * f, H * 0.42 - (y - 2) * f, f, Z];
}
function unproject(sx, sy) {           // mouse → a point on the plane through the middle of the flock
  const f = Math.min(W, H) * 1.6 / camDist, X = (sx - W / 2) / f, Y = -(sy - H * 0.42) / f + 2;
  const c = Math.cos(camA), s = Math.sin(camA);
  return [X * c, Y, -X * s];
}

function moveHawk(dt) {
  hawk.t -= dt;
  if (mouse) { const [x, y, z] = unproject(mouse.x, mouse.y); hawk.vx = (x - hawk.x) / Math.max(dt, 0.001) * 0.2; hawk.vy = (y - hawk.y) / Math.max(dt, .001) * 0.2; hawk.x += (x - hawk.x) * 0.2; hawk.y += (y - hawk.y) * 0.2; hawk.z += (z - hawk.z) * 0.2; hawk.mode = 'mouse'; return; }
  if (hawk.mode === 'mouse') hawk.mode = 'rest';
  if (!document.getElementById('hawk').checked) { hawk.mode = 'rest'; return; }
  if (hawk.mode === 'rest' && hawk.t <= 0) {          // launch a dive through the flock from off to one side
    let cx = 0, cy = 0, cz = 0; for (let i = 0; i < N; i += 10) { cx += pos[i * 3]; cy += pos[i * 3 + 1]; cz += pos[i * 3 + 2]; }
    const k = 10 / N; cx *= k; cy *= k; cz *= k;
    const side = Math.random() < .5 ? -1 : 1;
    hawk.x = cx + side * 45; hawk.y = cy + 18; hawk.z = cz;
    const d = Math.hypot(cx - hawk.x, cy - hawk.y, cz - hawk.z);
    hawk.vx = (cx - hawk.x) / d * 26; hawk.vy = (cy - hawk.y) / d * 26; hawk.vz = (cz - hawk.z) / d * 26;
    hawk.mode = 'dive'; hawk.t = 4;
  } else if (hawk.mode === 'dive') {
    hawk.x += hawk.vx * dt; hawk.y += hawk.vy * dt; hawk.z += hawk.vz * dt;
    if (hawk.t <= 0) { hawk.mode = 'rest'; hawk.t = 6 + Math.random() * 6; }
  }
}

function draw() {
  ctx.drawImage(sky, 0, 0, W, H);
  // three depth buckets: nearer birds darker and thicker
  const buckets = [new Path2D(), new Path2D(), new Path2D()];
  for (let i = 0; i < N; i++) {
    const [x, y, f, Z] = project(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]);
    const [x2, y2] = project(pos[i * 3] - vel[i * 3] * 0.03, pos[i * 3 + 1] - vel[i * 3 + 1] * 0.03, pos[i * 3 + 2] - vel[i * 3 + 2] * 0.03);
    const b = Z > 6 ? 0 : Z > -6 ? 1 : 2;
    buckets[b].moveTo(x, y); buckets[b].lineTo(x2, y2);
  }
  ctx.lineCap = 'round';
  [[2.6, 'rgba(20,14,28,0.9)'], [2.0, 'rgba(26,20,38,0.75)'], [1.4, 'rgba(34,28,52,0.55)']].forEach(([w, c], b) => { ctx.lineWidth = w; ctx.strokeStyle = c; ctx.stroke(buckets[b]); });
  if (hawk.mode !== 'rest') {
    const [x, y, f] = project(hawk.x, hawk.y, hawk.z), s = f * 0.9, flap = Math.sin(time * 18) * 0.4;
    ctx.fillStyle = '#120a10';
    ctx.beginPath(); ctx.moveTo(x - s * 2, y - s * flap); ctx.quadraticCurveTo(x - s, y - s * 0.4, x, y); ctx.quadraticCurveTo(x + s, y - s * 0.4, x + s * 2, y - s * flap); ctx.quadraticCurveTo(x, y + s * 0.5, x - s * 2, y - s * flap); ctx.fill();
  }
}

let last = 0;
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now; time += dt;
  camA += dt * 0.05;
  step(dt); draw();
  requestAnimationFrame(frame);
}

cv.addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerleave', () => mouse = null);
cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') mouse = null; });
document.getElementById('n').oninput = e => init(+e.target.value);
addEventListener('resize', size);
setTimeout(() => document.getElementById('hint').style.opacity = 0, 10000);
size(); init(N); hawk.t = 5; requestAnimationFrame(frame);
</script>
</body>
</html>
