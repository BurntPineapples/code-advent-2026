<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 18 · Bauble Selfie</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; font-family:system-ui,sans-serif; color:#fbefe0; background:radial-gradient(ellipse at 50% 35%, #3a1420 0%, #0c0508 70%); }
  #view { position:fixed; inset:0; }
  .back { position:fixed; top:12px; left:12px; z-index:2; color:#fffb; text-decoration:none; font-size:14px; background:#0008; padding:6px 10px; border-radius:8px; }
  .bar { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:2; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:max-content; max-width:94vw; }
  .bar button { background:#000a; color:#fbefe0; border:1px solid #ffffff2a; border-radius:10px; padding:9px 16px; font:inherit; font-size:15px; cursor:pointer; }
  #cam { background:#e8c66a; color:#1a1200; border:none; font-weight:700; }
  .note { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:2; font-size:13px; color:#fbefe0aa; text-align:center; width:max-content; max-width:70vw; }
  video { display:none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<a class="back" href="../../">← Calendar</a>
<div class="note" id="note">Look closely at the baubles. Then turn your camera on.<br>The video never leaves this page: nothing is uploaded or saved unless you snap a card.</div>
<div id="view"></div>
<video id="vid" playsinline muted></video>
<div class="bar"><button id="cam">📷 Turn on my camera</button><button id="snap">🎄 Snap a Christmas card</button></div>
<script type="module">
import * as THREE from 'three';

// ---------- an environment map we paint ourselves, every frame ----------
// It's an equirectangular panorama (like a 360° photo). The webcam goes in the
// patch that faces the viewer, so the baubles reflect *you*.
const EW = 1024, EH = 512;
const envCv = document.createElement('canvas'); envCv.width = EW; envCv.height = EH;
const eg = envCv.getContext('2d');
const room = document.createElement('canvas'); room.width = EW; room.height = EH;
{
  const g = room.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, EH);
  grd.addColorStop(0, '#2a1a20'); grd.addColorStop(0.45, '#7a4a30'); grd.addColorStop(0.55, '#4a2a18'); grd.addColorStop(1, '#1a0d08');
  g.fillStyle = grd; g.fillRect(0, 0, EW, EH);
  g.fillStyle = '#ffd9a0'; g.shadowColor = '#ffb050'; g.shadowBlur = 40; g.fillRect(140, 130, 120, 150); g.fillRect(560, 140, 90, 120);   // windows
  g.shadowBlur = 0;
  g.fillStyle = '#ff7a2a'; g.shadowColor = '#ff6a00'; g.shadowBlur = 60; g.fillRect(380, 300, 110, 60); g.shadowBlur = 0;               // fireplace
  for (let i = 0; i < 70; i++) {                                                                                                    // fairy lights
    const x = i * EW / 70, y = 90 + Math.sin(i * 0.45) * 22;
    g.fillStyle = ['#ff4d5e', '#ffd34d', '#4dd2ff', '#7dff8a', '#ff7ae6'][i % 5]; g.shadowColor = g.fillStyle; g.shadowBlur = 14;
    g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill();
  }
  g.shadowBlur = 0;
}
const vid = document.getElementById('vid');
let camOn = false;
function paintEnv() {
  eg.drawImage(room, 0, 0);
  // the patch facing the viewer is centred at u = 0.75
  const w = 330, h = 250, x = EW * 0.75 - w / 2, y = EH / 2 - h / 2 - 10;
  if (camOn && vid.readyState >= 2) {
    eg.save(); eg.beginPath(); eg.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, 7); eg.clip();
    eg.translate(x, y);          // drawn as the camera sees you: the sphere's reflection mirrors it, just like a real mirror
    const vw = vid.videoWidth, vh = vid.videoHeight, s = Math.max(w / vw, h / vh);
    eg.drawImage(vid, (w - vw * s) / 2, (h - vh * s) / 2, vw * s, vh * s);
    eg.restore();
  } else {
    eg.fillStyle = '#ffe9c7'; eg.shadowColor = '#ffcf80'; eg.shadowBlur = 30;
    eg.beginPath(); eg.ellipse(x + w / 2, y + h / 2, 60, 75, 0, 0, 7); eg.fill(); eg.shadowBlur = 0;   // a soft lamp where you'd be
  }
  envTex.needsUpdate = true;
}
const envTex = new THREE.CanvasTexture(envCv);
envTex.mapping = THREE.EquirectangularReflectionMapping; envTex.colorSpace = THREE.SRGBColorSpace;

// ---------- scene ----------
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100); camera.position.set(0, 0, 7.5);
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const mirror = (tint, rough = 0.03) => new THREE.MeshStandardMaterial({ color: tint, metalness: 1, roughness: rough, envMap: envTex });
const gold = new THREE.MeshStandardMaterial({ color: 0xd8b25a, metalness: 1, roughness: 0.3, envMap: envTex });
const baubles = [];
function bauble(r, tint, x, y, z, len) {
  const pivot = new THREE.Group(); pivot.position.set(x, 3.4, z); scene.add(pivot);
  const thread = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, len, 6), new THREE.MeshBasicMaterial({ color: 0xc9a44a }));
  thread.position.y = -len / 2; pivot.add(thread);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(r, 96, 64), mirror(tint)); ball.position.y = -len - r * 1.05; pivot.add(ball);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.16, r * 0.18, r * 0.2, 24), gold); cap.position.y = -len - r * 0.02; pivot.add(cap);
  baubles.push({ pivot, ball, phase: Math.random() * 6, amp: 0.03 + Math.random() * 0.03 });
}
bauble(1.35, 0xf2f2f2, 0, 0, 0, 1.75);          // the big one: pure silver, so you see yourself clearly
bauble(0.5, 0xff4a5a, -2.6, 0, -0.6, 1.1);
bauble(0.42, 0xffcf6e, 2.5, 0, -0.4, 0.8);
bauble(0.36, 0x6fe39a, -3.6, 0, -1.2, 2.3);
bauble(0.45, 0x7ab8ff, 3.5, 0, -1.0, 2.0);

// a pine branch along the top: a bough plus a few hundred needles
{
  const bough = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 10, 8), new THREE.MeshStandardMaterial({ color: 0x3a2414, roughness: 0.9 }));
  bough.rotation.z = Math.PI / 2 + 0.03; bough.position.set(0, 3.45, -0.3); scene.add(bough);
  const needles = new THREE.InstancedMesh(new THREE.ConeGeometry(0.03, 0.55, 4), new THREE.MeshStandardMaterial({ color: 0x1f5a32, roughness: 0.8 }), 700);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (let i = 0; i < 700; i++) {
    const x = -5 + Math.random() * 10;
    e.set((Math.random() - 0.5) * 2.2, Math.random() * 6.3, Math.PI / 2 + (Math.random() - 0.5) * 2.4);
    q.setFromEuler(e); m.compose(new THREE.Vector3(x, 3.45 + (Math.random() - 0.5) * 0.25, -0.3 + (Math.random() - 0.5) * 0.4), q, new THREE.Vector3(1, 1, 1));
    needles.setMatrixAt(i, m);
  }
  scene.add(needles);
  const light = new THREE.DirectionalLight(0xffe0b0, 1.2); light.position.set(2, 4, 5); scene.add(light);
}
// soft drifting snow
const snowGeo = new THREE.BufferGeometry(), SN = 400, sp = new Float32Array(SN * 3);
for (let i = 0; i < SN; i++) { sp[i * 3] = (Math.random() - 0.5) * 14; sp[i * 3 + 1] = (Math.random() - 0.5) * 9; sp[i * 3 + 2] = (Math.random() - 0.5) * 6; }
snowGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
const dot = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'), r = g.createRadialGradient(16, 16, 0, 16, 16, 16); r.addColorStop(0, '#fff'); r.addColorStop(1, '#fff0'); g.fillStyle = r; g.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(c); })();
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ size: 0.07, map: dot, transparent: true, depthWrite: false, opacity: 0.8 }));
scene.add(snow);

let mx = 0, my = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.8 ? 55 : 38; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  paintEnv();
  for (const b of baubles) { b.pivot.rotation.z = Math.sin(t * 1.1 + b.phase) * b.amp; b.ball.rotation.y = t * 0.2; }
  for (let i = 0; i < SN; i++) { sp[i * 3 + 1] -= 0.006 + (i % 7) * 0.001; sp[i * 3] += Math.sin(t + i) * 0.002; if (sp[i * 3 + 1] < -4.5) sp[i * 3 + 1] = 4.5; }
  snowGeo.attributes.position.needsUpdate = true;
  camera.position.x += (mx * 1.2 - camera.position.x) * 0.05; camera.position.y += (-my * 0.6 - camera.position.y) * 0.05;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
});

// ---------- buttons ----------
document.getElementById('cam').onclick = async e => {
  if (camOn) { vid.srcObject?.getTracks().forEach(t => t.stop()); camOn = false; e.target.textContent = '📷 Turn on my camera'; return; }
  try {
    vid.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
    await vid.play(); camOn = true; e.target.textContent = '📷 Camera off';
    document.getElementById('note').textContent = 'Wave! You are inside every bauble. Move your head to see the reflections curve.';
  } catch (err) {
    document.getElementById('note').textContent = 'No camera available (or permission was declined), so the baubles reflect a cosy room instead.';
  }
};
document.getElementById('snap').onclick = () => {
  const src = renderer.domElement, c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d');
  g.fillStyle = '#0c0508'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(src, 0, 0);
  const fs = Math.round(c.height * 0.07);
  g.font = `italic ${fs}px Georgia, serif`; g.textAlign = 'center'; g.fillStyle = '#ffe2a0'; g.shadowColor = '#000'; g.shadowBlur = 12;
  g.fillText('Merry Christmas!', c.width / 2, c.height - fs * 0.8);
  const a = document.createElement('a'); a.download = 'bauble-christmas-card.png'; a.href = c.toDataURL('image/png'); a.click();
};
</script>
</body>
</html>
