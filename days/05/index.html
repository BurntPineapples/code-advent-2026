<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 5 · Gift Within a Gift</title>
<style>
  html,body { margin:0; height:100%; background:#14060a; overflow:hidden; font-family:system-ui,sans-serif; color:#ffe9d6; user-select:none; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; cursor:zoom-in; }
  .back { position:fixed; top:12px; left:12px; z-index:2; color:#fffb; text-decoration:none; font-size:14px; background:#0008; padding:6px 10px; border-radius:8px; }
  #count { position:fixed; top:12px; right:12px; z-index:2; background:#0008; padding:6px 12px; border-radius:8px; font-size:14px; font-variant-numeric:tabular-nums; }
  #msg { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#000a; padding:8px 16px; border-radius:12px; font-size:15px; text-align:center; width:max-content; max-width:90vw; transition:opacity .6s; pointer-events:none; }
</style>
</head>
<body>
<a class="back" href="../../">← Calendar</a>
<div id="count">Boxes opened: 0</div>
<div id="msg">Press and hold (or hold Space) to open the present. Scroll to go back.</div>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const R = 0.6;          // each box is 60% the size of the one around it
const TWIST = 0.16;     // and turned slightly, so the dive spirals
const LID_AT = 0.65, LID_DUR = 0.4;
let W, H, DPR, base, t = -1, v = 0, holding = false, lastNow = 0, shown = 0;
const lastP = new Map(), patterns = new Map();

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const PAPERS = [['#b3122e', '#f3e6d0'], ['#0f5b34', '#e8c66a'], ['#123a7a', '#e9eef7'], ['#e8e2d4', '#c0192f'], ['#5b1e7a', '#f2c84b'], ['#c4542a', '#fff2dc'], ['#0e4e57', '#f39bb5'], ['#1c1c22', '#d8b25a']];
const RIBBONS = ['#e8c66a', '#f6f1e7', '#c0192f', '#2f7d4f', '#e9a0c0', '#7fb6ff'];
const TRINKETS = ['🍬', '🔔', '⭐', '🧦', '🍪', '🎄', '❄️', '🍭', '🎀', '🧸', '🕯️', '🍊'];

function boxStyle(k) {
  const r = rng(k * 7919 + 13), paper = PAPERS[(r() * PAPERS.length) | 0];
  return { paper, ribbon: RIBBONS[(r() * RIBBONS.length) | 0], kind: (r() * 6) | 0, dir: r() * Math.PI * 2,
           tissue: `hsl(${(r() * 360) | 0},45%,82%)`, trinkets: r() < 0.6 ? [[r() < .5 ? -1 : 1, r() < .5 ? -1 : 1, TRINKETS[(r() * TRINKETS.length) | 0]]] : [] };
}

// Each box gets its own wrapping paper: a small tile turned into a repeating pattern.
function paperPattern(k, st) {
  if (patterns.has(k)) return patterns.get(k);
  const T = 64, c = document.createElement('canvas'); c.width = c.height = T;
  const g = c.getContext('2d'), [bg, fg] = st.paper;
  g.fillStyle = bg; g.fillRect(0, 0, T, T); g.fillStyle = fg; g.strokeStyle = fg;
  switch (st.kind) {
    case 0: g.lineWidth = 9; for (let i = -T; i < T * 2; i += 22) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + T, T); g.stroke(); } break;   // stripes
    case 1: for (const [x, y] of [[16, 16], [48, 48], [48, 16], [16, 48]]) { g.beginPath(); g.arc(x, y, (x + y) % 64 ? 5 : 8, 0, 7); g.fill(); } break; // dots
    case 2: for (const [x, y] of [[16, 18], [48, 46]]) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? 4 : 10; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.fill(); } break; // stars
    case 3: g.globalAlpha = .45; g.fillRect(0, 20, T, 10); g.fillRect(20, 0, 10, T); g.globalAlpha = 1; g.fillRect(0, 50, T, 3); g.fillRect(50, 0, 3, T); break; // plaid
    case 4: g.lineWidth = 2; for (const [x, y] of [[20, 20], [52, 50]]) for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 10, y + Math.sin(a) * 10); g.stroke(); } break; // snowflakes
    case 5: g.lineWidth = 5; g.beginPath(); for (let x = 0; x <= T; x += 16) g.lineTo(x, x % 32 ? 22 : 10); g.stroke(); g.beginPath(); for (let x = 0; x <= T; x += 16) g.lineTo(x, x % 32 ? 54 : 42); g.stroke(); break; // zigzag
  }
  const p = ctx.createPattern(c, 'repeat');
  patterns.set(k, p);
  if (patterns.size > 40) patterns.delete(patterns.keys().next().value);
  return p;
}

function shadeHex(hsl, l) { return hsl.replace(/(\d+)%\)$/, (_, x) => `${Math.max(0, Math.min(100, x * l))}%)`); }

function drawBox(k, a, th, st) {
  const b = a * 0.8;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(th);
  // inside walls: four trapezoids, shaded as if lit from the top-left
  const walls = [[[-a, -a], [a, -a], [b, -b], [-b, -b], 0.62], [[a, -a], [a, a], [b, b], [b, -b], 0.85],
                 [[a, a], [-a, a], [-b, b], [b, b], 1.0], [[-a, a], [-a, -a], [-b, -b], [-b, b], 0.72]];
  for (const [p1, p2, p3, p4, l] of walls) {
    ctx.fillStyle = shadeHex(st.tissue, l * 0.8);
    ctx.beginPath(); ctx.moveTo(...p1); ctx.lineTo(...p2); ctx.lineTo(...p3); ctx.lineTo(...p4); ctx.fill();
  }
  ctx.fillStyle = st.tissue; ctx.fillRect(-b, -b, b * 2, b * 2);
  // the next box casts a soft shadow on the bottom
  const n = a * R;
  ctx.fillStyle = '#0005'; ctx.filter = `blur(${a * 0.04}px)`; ctx.fillRect(-n * 1.02 + a * 0.04, -n * 1.02 + a * 0.05, n * 2.04, n * 2.04); ctx.filter = 'none';
  // a little something tucked in the corner
  ctx.font = `${a * 0.13}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const [sx, sy, e] of st.trinkets) ctx.fillText(e, sx * (b + n) / 2, sy * (b + n) / 2);
  // rim: the cut edge of the wrapping paper
  ctx.strokeStyle = st.paper[0]; ctx.lineWidth = a * 0.035; ctx.strokeRect(-a, -a, a * 2, a * 2);
  ctx.restore();
}

function drawLid(k, a, th, st, p) {
  const e = p * p * (3 - 2 * p);               // smoothstep
  const dx = Math.cos(st.dir), dy = Math.sin(st.dir), A = a * 1.04;
  ctx.save();
  ctx.translate(W / 2 + dx * e * a * 1.6, H / 2 + dy * e * a * 1.6);
  ctx.rotate(th + e * (st.dir > Math.PI ? 1 : -1) * 0.9);
  ctx.scale(1 + e * 0.9, 1 + e * 0.9);          // lifting towards you
  ctx.globalAlpha = 1 - e * e;
  ctx.shadowColor = '#000a'; ctx.shadowBlur = a * (0.06 + e * 0.25); ctx.shadowOffsetY = a * (0.02 + e * 0.1);
  const pat = paperPattern(k, st);
  pat.setTransform(new DOMMatrix().scale(A / 140));
  ctx.fillStyle = pat; ctx.fillRect(-A, -A, A * 2, A * 2);
  ctx.shadowColor = 'transparent';
  // ribbon cross
  const w = A * 0.17;
  ctx.fillStyle = st.ribbon; ctx.fillRect(-w / 2, -A, w, A * 2); ctx.fillRect(-A, -w / 2, A * 2, w);
  ctx.fillStyle = '#0002'; ctx.fillRect(-w / 2, -A, w * 0.18, A * 2); ctx.fillRect(-A, -w / 2, A * 2, w * 0.18);
  // bow: two loops, two tails, a knot
  ctx.fillStyle = st.ribbon; ctx.strokeStyle = '#0003'; ctx.lineWidth = A * 0.012;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(s * A * 0.2, -A * 0.06, A * 0.21, A * 0.11, s * 0.5, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * A * 0.26, A * 0.32); ctx.lineTo(s * A * 0.14, A * 0.33); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0, 0, A * 0.08, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff4'; ctx.beginPath(); ctx.ellipse(-A * 0.25, -A * 0.1, A * 0.08, A * 0.03, 0.5, 0, 7); ctx.fill();
  ctx.restore();
}

function render() {
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) / 2);
  bg.addColorStop(0, '#3a0d16'); bg.addColorStop(1, '#0d0306');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const diag = Math.hypot(W, H), flying = [];
  const kStart = Math.max(0, Math.floor(t - Math.log(4 * diag / base) / Math.log(1 / R)));
  for (let k = kStart; k < kStart + 30; k++) {
    const a = base * Math.pow(R, k - t), th = (k - t) * TWIST, st = boxStyle(k);
    const p = Math.max(0, Math.min(1, (t - (k - LID_AT)) / LID_DUR));
    if ((lastP.get(k) || 0) === 0 && p > 0 && v > 0) rip();
    lastP.set(k, p);
    if (p === 0) { drawLid(k, a, th, st, 0); break; }   // a closed lid hides everything deeper
    drawBox(k, a, th, st);
    if (p < 1) flying.push([k, a, th, st, p]);
  }
  for (let i = flying.length - 1; i >= 0; i--) drawLid(...flying[i]);
  if (lastP.size > 200) lastP.clear();
}

function size() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  base = Math.min(W, H) * 0.4;
}

// ---- paper-rip sound, synthesised ----
let ac = null, muted = false;
function rip() {
  if (!ac || muted) return;
  const len = 0.28, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.3 ? 1 : 0.3);  // crinkly
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  const now = ac.currentTime;
  f.frequency.setValueAtTime(4500, now); f.frequency.exponentialRampToValueAtTime(900, now + len);
  const g = ac.createGain(); g.gain.setValueAtTime(0.35, now); g.gain.exponentialRampToValueAtTime(0.001, now + len);
  s.connect(f).connect(g).connect(ac.destination); s.start();
}

const MILESTONES = { 1: 'There was another present inside. Of course there was.', 10: '10 boxes deep. Someone wrapped this with a lot of patience.',
  25: '25 boxes, one for each day of advent.', 50: '50. The bottom must be close…', 100: '100 boxes. It doesn\'t end, does it?', 250: '250. You are now officially smaller than a snowflake.',
  1000: '1,000 boxes. Merry Christmas, you magnificent maniac.' };
function hud() {
  const opened = Math.max(0, Math.floor(t + LID_AT - LID_DUR) + 1);   // box k is fully open once t >= k - 0.25
  document.getElementById('count').textContent = `Boxes opened: ${opened}`;
  if (MILESTONES[opened] && shown !== opened) {
    shown = opened; const m = document.getElementById('msg');
    m.textContent = MILESTONES[opened]; m.style.opacity = 1;
    clearTimeout(hud.h); hud.h = setTimeout(() => m.style.opacity = 0, 3500);
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - lastNow) / 1000 || 0); lastNow = now;
  v += ((holding ? 1.1 : 0) - v) * Math.min(1, dt * 4);
  t = Math.max(-1, t + v * dt);
  render(); hud();
  requestAnimationFrame(frame);
}

function start() {
  holding = true;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (shown === 0) { document.getElementById('msg').style.opacity = 0; shown = -1; }
}
cv.addEventListener('pointerdown', start);
addEventListener('pointerup', () => holding = false);
addEventListener('pointercancel', () => holding = false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); start(); } if (e.key === 'm') muted = !muted; });
addEventListener('keyup', e => { if (e.code === 'Space') holding = false; });
addEventListener('wheel', e => { t = Math.max(-1, t + e.deltaY * 0.0015); }, { passive: true });
addEventListener('resize', size);
size(); requestAnimationFrame(frame);
</script>
</body>
</html>
