<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 19 · Midnight Forest</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#070d22; font-family:system-ui,sans-serif; color:#e6eeff; user-select:none; }
  #view { position:fixed; inset:0; touch-action:none; }
  .back { position:fixed; top:12px; left:12px; z-index:2; color:#fffb; text-decoration:none; font-size:14px; background:#0008; padding:6px 10px; border-radius:8px; }
  #snd { position:fixed; top:12px; right:12px; z-index:2; background:#0008; color:#e6eeff; border:1px solid #ffffff26; border-radius:8px; padding:6px 10px; font:inherit; font-size:14px; cursor:pointer; }
  .hud { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:2; font-size:13px; color:#e6eeffaa; text-align:center; pointer-events:none; width:max-content; max-width:92vw; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<a class="back" href="../../">← Calendar</a>
<button id="snd">🔔 Sound: off</button>
<div id="view"></div>
<div class="hud" id="hud">Move the mouse to steer · hold the mouse button (or Space) to fly faster</div>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.toneMapping = THREE.ACESFilmicToneMapping;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const SKY = 0x0a1533;
scene.background = new THREE.Color(SKY); scene.fog = new THREE.FogExp2(SKY, 0.013);
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 600);

scene.add(new THREE.HemisphereLight(0x6f88d8, 0x10162e, 0.35));
const moonLight = new THREE.DirectionalLight(0xa8bcff, 0.55); moonLight.position.set(-30, 60, -40); scene.add(moonLight); scene.add(moonLight.target);

// The path winds through the forest; everything is placed relative to it.
const pathX = z => 18 * Math.sin(z * 0.012) + 6 * Math.sin(z * 0.031);

// ---------- trees: one geometry with snowy tops, thousands of copies ----------
function treeGeometry() {
  // each tier is green underneath and frosted towards its tip
  const tint = (g, f) => { const p = g.attributes.position, c = new Float32Array(p.count * 3); for (let i = 0; i < p.count; i++) c.set(f(p.getY(i)), i * 3); g.setAttribute('color', new THREE.BufferAttribute(c, 3)); return g; };
  const green = [0.05, 0.2, 0.11], frost = [0.75, 0.82, 0.95];
  const parts = [[1.0, 2.6, 2.4], [2.4, 2.1, 2.2], [3.7, 1.5, 2.0], [4.8, 0.9, 1.6]].map(([y, r, h]) => {
    const g = new THREE.ConeGeometry(r, h, 9, 3).toNonIndexed();
    tint(g, yy => { const k = Math.min(1, Math.max(0, (yy / h + 0.5 - 0.3) / 0.7)) ** 1.5; return green.map((v, j) => v + (frost[j] - v) * k); });
    g.translate(0, y + h / 2, 0); return g;
  });
  const trunk = tint(new THREE.CylinderGeometry(0.22, 0.3, 1.4, 6).toNonIndexed(), () => [0.22, 0.13, 0.07]); trunk.translate(0, 0.7, 0);
  return mergeGeometries([...parts, trunk]);
}
const NT = 1500, SPAN = 420;
const trees = new THREE.InstancedMesh(treeGeometry(), new THREE.MeshLambertMaterial({ vertexColors: true }), NT);
scene.add(trees);
const treeData = [];
const BULBS_PER = 14, bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.11, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }), NT * BULBS_PER);
bulbs.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(NT * BULBS_PER * 3), 3);
scene.add(bulbs);
const BULB_COLS = [0xff3b4f, 0xffd24a, 0x4ad8ff, 0x7dff8a, 0xff7ae6, 0xffa64d].map(c => new THREE.Color(c).multiplyScalar(4));
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3(), hide = new THREE.Matrix4().makeScale(0, 0, 0);

function placeTree(i, z) {
  const side = Math.random() < 0.5 ? -1 : 1, off = 5.5 + Math.random() ** 1.6 * 70;
  const x = pathX(z) + side * off, s = 0.7 + Math.random() * 0.9;
  const decorated = off < 30 && Math.random() < 0.22;
  treeData[i] = { z, x, s, decorated };
  q.setFromAxisAngle(v3.set(0, 1, 0), Math.random() * 6.3);
  trees.setMatrixAt(i, m4.compose(v3.set(x, 0, z), q, s3.set(s, s * (0.85 + Math.random() * 0.4), s)));
  for (let k = 0; k < BULBS_PER; k++) {
    const j = i * BULBS_PER + k;
    if (!decorated) { bulbs.setMatrixAt(j, hide); continue; }
    const h = 1.4 + (k / BULBS_PER) * 4.2, r = (2.6 - (k / BULBS_PER) * 1.9) * 0.92, a = k * 2.4;   // a spiral up the tree
    bulbs.setMatrixAt(j, m4.makeTranslation(x + Math.cos(a) * r * s, h * s, z + Math.sin(a) * r * s));
    bulbs.setColorAt(j, BULB_COLS[(k + i) % BULB_COLS.length]);
  }
}
for (let i = 0; i < NT; i++) placeTree(i, -Math.random() * SPAN + 10);

// ---------- lanterns along the path, a few with real lights ----------
const lanterns = [];
const postMat = new THREE.MeshLambertMaterial({ color: 0x2a1c12 }), glowMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffb35a).multiplyScalar(3) });
for (let i = 0; i < 14; i++) {
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 2.4, 6), postMat); post.position.y = 1.2; g.add(post);
  const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.45, 0.35), glowMat); lamp.position.y = 2.55; g.add(lamp);
  scene.add(g); lanterns.push({ g, z: -i * 30 - 10 });
}
const lights = Array.from({ length: 4 }, () => { const l = new THREE.PointLight(0xffa04a, 9, 20, 1.6); scene.add(l); return l; });

// a cabin now and then, windows glowing
function cabin() {
  const g = new THREE.Group(), wall = new THREE.MeshLambertMaterial({ color: 0x5a2e1c }), white = new THREE.MeshLambertMaterial({ color: 0xe8eeff });
  const body = new THREE.Mesh(new THREE.BoxGeometry(6, 3.2, 5), wall); body.position.y = 1.6; g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(4.8, 2.6, 4, 1), white); roof.position.y = 4.4; roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, 0.85); g.add(roof);
  const win = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffc070).multiplyScalar(2.5) });
  for (const x of [-1.6, 1.6]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.9), win); w.position.set(x, 1.8, 2.51); g.add(w); }
  const chim = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.8, 0.6), wall); chim.position.set(1.5, 4.6, 0); g.add(chim);
  scene.add(g); return g;
}
const cabins = [cabin(), cabin()].map((g, i) => ({ g, z: -120 - i * 200 }));

// ground, moon, stars, snowfall
const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshLambertMaterial({ color: 0x8a98c4 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const moon = new THREE.Mesh(new THREE.SphereGeometry(9, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xfff6dc).multiplyScalar(1.6), fog: false }));
scene.add(moon);
const starGeo = new THREE.BufferGeometry(), starPos = new Float32Array(1500 * 3);
for (let i = 0; i < 1500; i++) { const a = Math.random() * 6.28, e = Math.random() * 1.3 + 0.12; starPos.set([Math.cos(a) * Math.cos(e) * 480, Math.sin(e) * 480, Math.sin(a) * Math.cos(e) * 480], i * 3); }
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false })); scene.add(stars);
const SN = 4000, snowGeo = new THREE.BufferGeometry(), snowPos = new Float32Array(SN * 3);
for (let i = 0; i < SN; i++) snowPos.set([(Math.random() - 0.5) * 60, Math.random() * 25, (Math.random() - 0.5) * 60], i * 3);
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const flake = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'), r = g.createRadialGradient(16, 16, 0, 16, 16, 16); r.addColorStop(0, '#fff'); r.addColorStop(0.4, '#ffffffaa'); r.addColorStop(1, '#fff0'); g.fillStyle = r; g.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(c); })();
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, map: flake, transparent: true, opacity: 0.9, depthWrite: false })); scene.add(snow);

// ---------- bloom makes every light glow ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.85, 0.55, 0.82); composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- flying ----------
let camZ = 0, speed = 9, boost = false, steer = 0, steerT = 0, travelled = 0;
addEventListener('pointermove', e => { steerT = (e.clientX / innerWidth - 0.5) * 2; });
addEventListener('pointerdown', () => { boost = true; startSound(); });
addEventListener('pointerup', () => boost = false);
addEventListener('keydown', e => { if (e.code === 'Space') { boost = true; e.preventDefault(); } if (e.code === 'ArrowLeft') steerT = Math.max(-1, steerT - 0.2); if (e.code === 'ArrowRight') steerT = Math.min(1, steerT + 0.2); });
addEventListener('keyup', e => { if (e.code === 'Space') boost = false; });

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  speed += ((boost ? 34 : 9) - speed) * Math.min(1, dt * 1.5);
  camZ -= speed * dt; travelled += speed * dt;
  steer += (steerT - steer) * Math.min(1, dt * 3);
  const cx = pathX(camZ) + steer * 4, ahead = camZ - 18;
  camera.position.set(cx, 2.4 + Math.sin(t * 1.7) * 0.06, camZ);
  camera.lookAt(pathX(ahead) + steer * 9, 2.0, ahead);
  camera.rotateZ(-steer * 0.08 - (pathX(camZ - 5) - pathX(camZ)) * 0.02);

  // recycle anything that fell behind us to the far end of the forest
  let dirty = false;
  for (let i = 0; i < NT; i++) if (treeData[i].z > camZ + 12) { placeTree(i, treeData[i].z - SPAN); dirty = true; }
  if (dirty) { trees.instanceMatrix.needsUpdate = true; bulbs.instanceMatrix.needsUpdate = true; bulbs.instanceColor.needsUpdate = true; }
  for (const l of lanterns) { if (l.z > camZ + 10) l.z -= 14 * 30; const side = (Math.round(l.z / 30) % 2) ? 1 : -1; l.g.position.set(pathX(l.z) + side * 3.2, 0, l.z); }
  lanterns.filter(l => l.z < camZ).sort((a, b) => b.z - a.z).slice(0, 4).forEach((l, i) => lights[i].position.set(l.g.position.x, 2.6, l.z));
  for (const c of cabins) { if (c.z > camZ + 20) c.z -= 400; const side = Math.round(c.z) % 2 ? 1 : -1; c.g.position.set(pathX(c.z) + side * 13, 0, c.z); c.g.rotation.y = side > 0 ? -0.6 : 0.6; }

  ground.position.set(cx, 0, camZ - 200);
  moon.position.set(cx - 120, 140, camZ - 380); stars.position.set(cx, 0, camZ);
  moonLight.position.set(cx - 30, 60, camZ - 40); moonLight.target.position.set(cx, 0, camZ);
  for (let i = 0; i < SN; i++) {                       // snow drifts down and streams past as you speed up
    snowPos[i * 3 + 1] -= dt * (1.2 + (i % 5) * 0.2);
    let x = snowPos[i * 3], y = snowPos[i * 3 + 1], z = snowPos[i * 3 + 2];
    if (y < 0) snowPos[i * 3 + 1] = 25;
    if (z > camZ + 8) snowPos[i * 3 + 2] -= 60; if (z < camZ - 52) snowPos[i * 3 + 2] += 60;
    if (x > cx + 30) snowPos[i * 3] -= 60; if (x < cx - 30) snowPos[i * 3] += 60;
  }
  snowGeo.attributes.position.needsUpdate = true;
  document.getElementById('hud').textContent = `${Math.round(travelled)} m into the forest · ${Math.round(speed * 3.6)} km/h · move the mouse to steer, hold to fly faster`;
  if (audio) audio.update(speed, dt);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- sound: wind and sleigh bells, all synthesised ----------
let audio = null, soundOn = false;
function startSound() { if (soundOn && audio) audio.ac.resume(); }
document.getElementById('snd').onclick = e => {
  e.stopPropagation();
  if (!audio) {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const buf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.7; const wind = ac.createGain();
    src.connect(bp).connect(wind).connect(master); src.start();
    let nextBell = 0;
    audio = { ac, master, update(sp, dt) {
      wind.gain.value = 0.04 + sp * 0.006; bp.frequency.value = 300 + sp * 25 + Math.sin(ac.currentTime * 0.7) * 120;
      nextBell -= dt * (0.6 + sp * 0.12);
      if (nextBell <= 0) { nextBell = 0.15 + Math.random() * 0.25;
        const f = [2637, 2794, 3136, 3520][(Math.random() * 4) | 0], now = ac.currentTime;
        for (const [m, v] of [[1, 0.025], [2.7, 0.012]]) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f * m; g.gain.setValueAtTime(v, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25); o.connect(g).connect(master); o.start(now); o.stop(now + 0.3); } }
    } };
  }
  soundOn = !soundOn; audio.ac.resume();
  audio.master.gain.setTargetAtTime(soundOn ? 1 : 0, audio.ac.currentTime, 0.3);
  e.target.textContent = soundOn ? '🔔 Sound: on' : '🔔 Sound: off';
};
</script>
</body>
</html>
