<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const DAYS = [null,
  'First Snow', 'Fairy Lights', 'No Two Alike', 'Hearth', 'Gift Within a Gift',
  'The Music Box', 'The Neural Painter', 'Light the Tree', 'Chimney Drop', 'Ornament Lathe',
  'Murmuration', 'Hot Cocoa', 'The Carol Machine', 'Reindeer Flight School', 'Bell Wave',
  'Snow Globe', 'Northern Lights', 'Bauble Selfie', 'Midnight Forest', 'A Million Snowflakes',
  "Santa's Route", 'The Snow Conductor', 'SLEIGH-OS', 'Gingerbread Gait'];
let opened = new Set();
try { opened = new Set(JSON.parse(localStorage.getItem('opened') || '[]')); } catch {}
opened.add(25);
try { localStorage.setItem('opened', JSON.stringify([...opened])); } catch {}
const nOpened = [...opened].filter(d => d >= 1 && d <= 24).length;
$('count').textContent = nOpened >= 24 ? 'You opened all 24 doors. 🌟' : `You opened ${nOpened} of 24 doors. The dim ornaments are the ones you missed.`;

// ---------- renderer ----------
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' }); }
catch { $('err').style.display = 'flex'; $('start').remove(); throw new Error('no webgl'); }
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x02030a);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
const group = new THREE.Group(); scene.add(group);

// ---------- shapes: every shape is N points with N colours ----------
const N = innerWidth < 700 ? 32000 : 60000;
const camZ = a => Math.max(14, 3.9 / (0.384 * a));     // back the camera off just enough that the tree fits the width
const BASE = -3.3, HT = 7.0, RAD = 2.9, TOP = BASE + HT;
const col = new THREE.Color();
const R = Math.random;
function starPoly(Ro, Ri) { const v = []; for (let k = 0; k < 10; k++) { const a = Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? Ri : Ro; v.push([Math.cos(a) * r, Math.sin(a) * r]); } return v; }
function inPoly(x, y, v) { let c = false; for (let i = 0, j = v.length - 1; i < v.length; j = i++) if ((v[i][1] > y) !== (v[j][1] > y) && x < (v[j][0] - v[i][0]) * (y - v[i][1]) / (v[j][1] - v[i][1]) + v[i][0]) c = !c; return c; }
function starPoint(Ro, Ri) { const v = starPoly(Ro, Ri); for (;;) { const x = (R() * 2 - 1) * Ro, y = (R() * 2 - 1) * Ro; if (inPoly(x, y, v)) return [x, y]; } }
function shape() { return { pos: new Float32Array(N * 3), col: new Float32Array(N * 3) }; }
const put = (s, i, x, y, z, c) => { s.pos[i * 3] = x; s.pos[i * 3 + 1] = y; s.pos[i * 3 + 2] = z; s.col[i * 3] = c.r; s.col[i * 3 + 1] = c.g; s.col[i * 3 + 2] = c.b; };

const kind = new Float32Array(N);            // what each point is on the tree: 0 needle, 1 garland, 2 star, 3 trunk, 4 sparkle
function makeTree() {
  const s = shape();
  for (let i = 0; i < N; i++) {
    const r = R();
    if (r < 0.05) {                                                          // the star on top
      const [x, y] = starPoint(0.62, 0.26); kind[i] = 2;
      put(s, i, x, TOP + 0.45 + y, (R() - 0.5) * 0.14, col.setRGB(1, 0.8, 0.4).multiplyScalar(0.9));
    } else if (r < 0.19) {                                                   // a spiral garland of warm lights
      const u = R(), h = 0.03 + u * 0.88, Rr = (1 - h) * RAD + 0.07, a = u * Math.PI * 2 * 6.5 + (R() - 0.5) * 0.06;
      kind[i] = 1; put(s, i, Math.cos(a) * Rr, BASE + h * HT + (R() - 0.5) * 0.05, Math.sin(a) * Rr, col.setRGB(1, 0.72, 0.36).multiplyScalar(0.5));
    } else if (r < 0.21) {                                                   // trunk
      const a = R() * 6.283, rr = 0.28 * Math.sqrt(R());
      kind[i] = 3; put(s, i, Math.cos(a) * rr, BASE - 0.75 + R() * 0.8, Math.sin(a) * rr, col.setRGB(0.32, 0.16, 0.06));
    } else {                                                                 // needles, in tiers, denser at the bottom
      const h = 1 - Math.sqrt(R()), tier = (h * 6.5) % 1;
      const Rr = (1 - h) * RAD * (0.7 + 0.3 * tier), rr = Rr * (0.5 + 0.5 * Math.sqrt(R())), a = R() * 6.283;
      const y = BASE + h * HT - (rr / (Rr + 1e-3)) * 0.18 * (1 - h);
      if (R() < 0.035) {
        kind[i] = 4;
        const pal = [[1, 0.2, 0.2], [1, 0.75, 0.3], [0.35, 0.55, 1], [1, 1, 1], [0.9, 0.3, 0.9]][(R() * 5) | 0];
        put(s, i, Math.cos(a) * rr, y, Math.sin(a) * rr, col.setRGB(...pal).multiplyScalar(0.8));
      } else {
        kind[i] = 0;
        put(s, i, Math.cos(a) * rr, y, Math.sin(a) * rr, col.setHSL(0.33 + R() * 0.08, 0.7, 0.07 + R() * 0.13 + (rr / (Rr + 1e-3)) * 0.06));
      }
    }
  }
  return s;
}
function makeBurst() {
  const s = shape(), K = 7, C = [];
  for (let k = 0; k < K; k++) C.push({ x: (R() - 0.5) * 10, y: -0.5 + R() * 5, z: (R() - 0.5) * 3, r: 1.3 + R() * 1.4, hue: k / K + R() * 0.05 });
  // each firework is ~120 streaks flying out from its centre, brightest at the tips
  for (const c of C) c.rays = Array.from({ length: 120 }, () => new THREE.Vector3().randomDirection());
  for (let i = 0; i < N; i++) {
    const c = C[i % K], d = c.rays[(R() * 120) | 0], f = 0.2 + 0.8 * Math.sqrt(R()), rr = c.r * f, j = 0.025;
    put(s, i, c.x + d.x * rr + (R() - 0.5) * j, c.y + d.y * rr - rr * rr * 0.12 + (R() - 0.5) * j, c.z + d.z * rr,
        col.setHSL((c.hue + (f > 0.92 ? 0.08 : 0)) % 1, 0.85, 0.5 + f * 0.2).multiplyScalar(0.25 + f * f * 0.9));
  }
  return s;
}
function makeStar() {
  const s = shape(), Ro = 3.4, Ri = 1.4, v = starPoly(Ro, Ri);
  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (R() < 0.22) {                         // crisp edges
      const k = (R() * 10) | 0, a = v[k], b = v[(k + 1) % 10], t = R();
      x = a[0] + (b[0] - a[0]) * t; y = a[1] + (b[1] - a[1]) * t; z = (R() - 0.5) * 0.08;
    } else { [x, y] = starPoint(Ro, Ri); z = (R() - 0.5) * 0.9 * (1 - Math.hypot(x, y) / Ro); }
    const w = Math.max(0, 1 - Math.hypot(x, y) / Ro);
    put(s, i, x, y + 0.5, z, col.setRGB(1, 0.7 + w * 0.3, 0.3 + w * 0.65).multiplyScalar(0.45 + w * 0.3));
  }
  return s;
}
function makeFlake() {
  const s = shape(), segs = [];
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3, ux = Math.cos(a), uy = Math.sin(a);
    segs.push([0, 0, ux * 3.4, uy * 3.4]);
    for (const [t, L] of [[0.33, 1.0], [0.55, 0.8], [0.76, 0.5]]) for (const sg of [-1, 1]) {
      const b = a + sg * Math.PI / 3, px = ux * 3.4 * t, py = uy * 3.4 * t;
      segs.push([px, py, px + Math.cos(b) * L, py + Math.sin(b) * L]);
    }
    const b0 = k * Math.PI / 3 + Math.PI / 6, b1 = b0 + Math.PI / 3;
    segs.push([Math.cos(b0) * 0.7, Math.sin(b0) * 0.7, Math.cos(b1) * 0.7, Math.sin(b1) * 0.7]);
  }
  const lens = segs.map(q => Math.hypot(q[2] - q[0], q[3] - q[1])), tot = lens.reduce((a, b) => a + b);
  for (let i = 0; i < N; i++) {
    let u = R() * tot, k = 0; while (u > lens[k]) u -= lens[k++];
    const q = segs[k], t = R(), j = 0.07;
    const x = q[0] + (q[2] - q[0]) * t + (R() - 0.5) * j, y = q[1] + (q[3] - q[1]) * t + (R() - 0.5) * j;
    const w = 1 - Math.hypot(x, y) / 3.6;
    put(s, i, x, y + 0.5, (R() - 0.5) * 0.18, col.setRGB(0.55 + w * 0.4, 0.8 + w * 0.2, 1).multiplyScalar(0.5));
  }
  return s;
}
function makeText() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  let fs = 200; x.font = `bold ${fs}px Georgia, serif`;
  fs = Math.floor(fs * 960 / x.measureText('CHRISTMAS').width); x.font = `bold ${fs}px Georgia, serif`;
  x.fillText('MERRY', 512, 256 - fs * 0.62); x.fillText('CHRISTMAS', 512, 256 + fs * 0.55);
  const d = x.getImageData(0, 0, 1024, 512).data, px = [];
  for (let yy = 0; yy < 512; yy += 2) for (let xx = 0; xx < 1024; xx += 2) if (d[(yy * 1024 + xx) * 4 + 3] > 128) px.push(xx, yy);
  const s = shape(), M = px.length / 2;
  // on a tall phone screen the words would run off the sides, so shrink them to fit
  const a = innerWidth / innerHeight, visW = 2 * Math.tan(21 * Math.PI / 180) * camZ(a) * a, fit = Math.min(1, visW * 0.92 / 11.5);
  for (let i = 0; i < N; i++) {
    const k = (R() * M) | 0, X = px[k * 2] + R() * 2, Y = px[k * 2 + 1] + R() * 2;
    const line1 = Y < 256 - fs * 0.04, t = X / 1024;
    line1 ? col.setRGB(1, 0.25 + t * 0.55, 0.2 + t * 0.15) : col.setRGB(1, 0.8 + t * 0.2, 0.45 + t * 0.5);
    put(s, i, (X - 512) / 1024 * 11.5 * fit, (256 - Y) / 1024 * 11.5 * fit + 0.5, (R() - 0.5) * 0.25, col.multiplyScalar(0.8));
  }
  return s;
}
function makeSnow() {
  const s = shape();
  for (let i = 0; i < N; i++) put(s, i, (R() - 0.5) * 18, (R() - 0.5) * 12, (R() - 0.5) * 10, col.setRGB(0.7, 0.8, 1).multiplyScalar(0.18 + R() * 0.2));
  return s;
}
const SHAPES = { tree: makeTree(), burst: makeBurst(), star: makeStar(), flake: makeFlake(), text: makeText(), snow: makeSnow() };

// ---------- the particle system ----------
// Each point stores where it is coming FROM and where it is going TO. One number,
// uMorph, slides everything between them, with a random head start per point.
const geo = new THREE.BufferGeometry();
const rnd = new Float32Array(N), size = new Float32Array(N);
for (let i = 0; i < N; i++) { rnd[i] = R(); size[i] = kind[i] === 0 ? 0.7 + R() * 0.8 : kind[i] === 1 ? 1.5 : kind[i] === 2 ? 1.9 : kind[i] === 4 ? 2.4 : 1; }
const A = (arr, n) => new THREE.BufferAttribute(arr, n);
geo.setAttribute('position', A(SHAPES.snow.pos.slice(), 3));
geo.setAttribute('aTo', A(SHAPES.snow.pos.slice(), 3));
geo.setAttribute('aColFrom', A(SHAPES.snow.col.slice(), 3));
geo.setAttribute('aColTo', A(SHAPES.snow.col.slice(), 3));
geo.setAttribute('aRand', A(rnd, 1)); geo.setAttribute('aSize', A(size, 1)); geo.setAttribute('aKind', A(kind, 1));
const U = {
  uTime: { value: 0 }, uMorph: { value: 0 }, uPx: { value: 30 }, uBeat: { value: 0 },
  uSnowFrom: { value: 1 }, uSnowTo: { value: 1 }, uTree: { value: 0 }, uStarK: { value: 0.12 },
};
const mat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uMorph, uPx, uBeat, uSnowFrom, uSnowTo, uTree, uStarK;
    attribute vec3 aTo, aColFrom, aColTo; attribute float aRand, aSize, aKind;
    varying vec3 vCol;
    vec3 fall(vec3 p) {     // snow: drift down forever, wrapping round
      p.y = mod(p.y - uTime * (0.35 + aRand * 0.5) + 6.0, 12.0) - 6.0;
      p.x += sin(uTime * 0.6 + aRand * 20.0) * 0.35;
      return p;
    }
    void main() {
      vec3 from = uSnowFrom > 0.5 ? fall(position) : position;
      vec3 to = uSnowTo > 0.5 ? fall(aTo) : aTo;
      float e = clamp((uMorph - aRand * 0.35) / 0.65, 0.0, 1.0);
      e = e * e * (3.0 - 2.0 * e);
      vec3 p = mix(from, to, e);
      float fly = sin(3.14159 * e);                              // swirl while in flight
      p += fly * vec3(sin(aRand * 40.0 + uTime * 1.3), cos(aRand * 23.0 + uTime) * 0.6, cos(aRand * 31.0 + uTime * 1.7)) * 0.7;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      vec3 c = mix(aColFrom, aColTo, e);
      // tree-only effects: chasing garland, twinkling baubles, the star
      float isG = step(0.5, aKind) * step(aKind, 1.5), isS = step(1.5, aKind) * step(aKind, 2.5), isK = step(3.5, aKind);
      float chase = 0.35 + 1.4 * pow(0.5 + 0.5 * sin(uTime * 3.0 - p.y * 2.2 + atan(p.z, p.x)), 3.0);
      float twk = 0.25 + 1.6 * pow(0.5 + 0.5 * sin(uTime * (1.5 + aRand * 3.0) + aRand * 50.0), 6.0);
      c *= mix(1.0, chase, isG * uTree) * mix(1.0, twk, isK * uTree) * mix(1.0, uStarK, isS * uTree);
      float spark = step(0.9, aRand) * uBeat;
      c *= 1.0 + spark * 2.0;
      vCol = c;
      gl_PointSize = aSize * uPx * (1.0 + spark) / -mv.z;
    }`,
  fragmentShader: `
    varying vec3 vCol;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(vCol * a * 0.32, 1.0);    // 60,000 points add up fast
    }`,
});
const points = new THREE.Points(geo, mat); points.frustumCulled = false; group.add(points);

// soft glow on the snowy ground under the tree
{
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(150,170,230,0.45)'); g.addColorStop(0.5, 'rgba(70,90,160,0.15)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  m.rotation.x = -Math.PI / 2; m.position.y = BASE - 0.8; scene.add(m);
}

// ---------- the 24 ornaments ----------
const ORN_COLORS = [0xd8283a, 0xf2b53c, 0x2f6fe0, 0x23a45a, 0xa040d8, 0xe8e8f0];
scene.add(new THREE.AmbientLight(0x8090c0, 0.6));
const key = new THREE.PointLight(0xffd9a0, 30, 30); key.position.set(3, 4, 7); scene.add(key);
const fill = new THREE.PointLight(0x7aa0ff, 14, 30); fill.position.set(-5, 0, 5); scene.add(fill);
const orns = [];
const sphere = new THREE.SphereGeometry(0.19, 28, 18), cap = new THREE.CylinderGeometry(0.05, 0.05, 0.08, 10);
for (let d = 1; d <= 24; d++) {
  const h = 0.07 + (d - 1) / 23 * 0.78, a = d * 2.39996;               // a golden-angle spiral, Day 1 at the bottom
  const rr = (1 - h) * RAD * 0.86 + 0.12;
  const c = ORN_COLORS[(d - 1) % ORN_COLORS.length], lit = opened.has(d);
  const m = new THREE.Mesh(sphere, new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: lit ? 0.9 : 0.12, roughness: 0.25, metalness: 0.55 }));
  const k = new THREE.Mesh(cap, new THREE.MeshStandardMaterial({ color: 0xd8b060, metalness: 0.9, roughness: 0.3 }));
  k.position.y = 0.2; m.add(k);
  m.position.set(Math.cos(a) * rr, BASE + h * HT - 0.05, Math.sin(a) * rr);
  m.userData = { day: d, lit, base: lit ? 0.9 : 0.12, s: 0, target: 0 };
  m.scale.setScalar(0.0001);
  group.add(m); orns.push(m);
}
const starHit = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
starHit.position.y = TOP + 0.45; group.add(starHit);

// gentle snow all around (separate from the morphing points)
{
  const M = 2500, p = new Float32Array(M * 3), r = new Float32Array(M);
  for (let i = 0; i < M; i++) { p[i * 3] = (R() - 0.5) * 30; p[i * 3 + 1] = (R() - 0.5) * 14; p[i * 3 + 2] = (R() - 0.5) * 16 - 2; r[i] = R(); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', A(p, 3)); g.setAttribute('aRand', A(r, 1));
  const m = new THREE.ShaderMaterial({ uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `uniform float uTime, uPx; attribute float aRand; varying float vA;
      void main() { vec3 p = position; p.y = mod(p.y - uTime * (0.25 + aRand * 0.4) + 7.0, 14.0) - 7.0; p.x += sin(uTime * 0.5 + aRand * 30.0) * 0.4;
        vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = (1.0 + aRand * 1.5) * uPx / -mv.z; vA = 0.12 + aRand * 0.18; }`,
    fragmentShader: `varying float vA; void main() { float d = length(gl_PointCoord - 0.5); gl_FragColor = vec4(vec3(0.85, 0.9, 1.0) * smoothstep(0.5, 0.0, d) * vA, 1.0); }` });
  const s = new THREE.Points(g, m); s.frustumCulled = false; scene.add(s);
}

// ---------- post-processing: bloom makes every bright point glow ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.9, 0.45, 0.55); composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w / h;
  camera.position.set(0, 0.7, camZ(camera.aspect)); camera.lookAt(0, 0.35, 0);
  camera.updateProjectionMatrix();
  U.uPx.value = 34 * renderer.getPixelRatio() * (h / 900);
}
addEventListener('resize', resize); resize();

// ---------- morphing ----------
let cur = 'snow', mt = { start: 0, dur: 1 };
function morph(name, dur, opts = {}) {
  const g = geo.attributes, from = opts.fromSnow ? SHAPES.snow : SHAPES[cur], to = SHAPES[name];
  g.position.array.set(from.pos); g.aColFrom.array.set(from.col);
  g.aTo.array.set(to.pos); g.aColTo.array.set(to.col);
  for (const k of ['position', 'aColFrom', 'aTo', 'aColTo']) g[k].needsUpdate = true;
  U.uSnowFrom.value = opts.fromSnow || cur === 'snow' ? 1 : 0;
  U.uSnowTo.value = name === 'snow' ? 1 : 0;
  U.uMorph.value = 0; mt = { start: performance.now(), dur }; cur = name;
}

// ---------- music: an original music-box waltz, built note by note ----------
let ac = null, master, verb, musicOn = true, padOscs = [], padF;
const BEAT = 0.6, mtof = m => 440 * 2 ** ((m - 69) / 12);
const CH = { C: [48, 52, 55], Am: [45, 48, 52], F: [41, 45, 48], G: [43, 47, 50], Em: [40, 43, 47], G7: [43, 47, 50, 53] };
const BARS = ['C', 'Am', 'F', 'G', 'C', 'Em', 'F', 'G7', 'Am', 'F', 'C', 'G', 'F', 'G', 'C', 'C'];
const MEL = [[0,2,76],[2,1,79],[3,2,81],[5,1,79],[6,1,77],[7,1,76],[8,1,74],[9,2,74],[11,1,71],[12,2,72],[14,1,76],[15,1,79],[16,1,76],[17,1,79],
  [18,2,81],[20,1,84],[21,2,83],[23,1,79],[24,2,81],[26,1,76],[27,1,77],[28,1,81],[29,1,84],[30,2,79],[32,1,76],[33,3,74],
  [36,2,84],[38,1,81],[39,1,83],[40,1,81],[41,1,79],[42,3,84],[45,1,79],[46,1,76],[47,1,72]];
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = musicOn ? 0.8 : 0; master.connect(ac.destination);
  verb = ac.createConvolver();
  const len = ac.sampleRate * 3.5, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (R() * 2 - 1) * (1 - i / len) ** 2.6; }
  verb.buffer = ir; const wet = ac.createGain(); wet.gain.value = 0.42; verb.connect(wet); wet.connect(master);
  padF = ac.createBiquadFilter(); padF.type = 'lowpass'; padF.frequency.value = 700;
  const pg = ac.createGain(); pg.gain.value = 0.045; padF.connect(pg); pg.connect(master); pg.connect(verb);
  for (let k = 0; k < 6; k++) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(CH.C[k % 3] + 12); o.detune.value = k < 3 ? -7 : 7; o.connect(padF); o.start(); padOscs.push(o); }
}
function voice(type, f, t, vol, dec, dest = true) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; o.connect(g); g.connect(master); if (dest) g.connect(verb);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
  o.start(t); o.stop(t + dec + 0.05);
}
const box = (m, t, v = 0.16) => { const f = mtof(m); voice('sine', f, t, v, 1.8); voice('sine', f * 2, t, v * 0.25, 0.6); voice('sine', f * 4.2, t, v * 0.12, 0.18); };
const pluck = (m, t, v = 0.05) => { voice('triangle', mtof(m), t, v, 0.5); };
const bass = (m, t, v = 0.14) => { voice('sine', mtof(m), t, v, 1.6, false); voice('triangle', mtof(m), t, v * 0.3, 0.6, false); };
const bell = (m, t, v = 0.08) => { const f = mtof(m); [[1, 1, 3], [2.76, 0.35, 1.4], [5.4, 0.15, 0.6], [8.9, 0.06, 0.3]].forEach(([k, a, d]) => voice('sine', f * k, t, v * a, d)); };
function noiseBurst(t, dur, vol, f0, f1) {
  const len = Math.ceil(ac.sampleRate * dur), b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (R() * 2 - 1) * (1 - i / len) ** 3;
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; fl.type = 'bandpass'; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur); g.gain.value = vol;
  s.connect(fl); fl.connect(g); g.connect(master); g.connect(verb); s.start(t);
}

// ---------- the timeline: notes and visuals share one clock ----------
let events = [], t0 = 0, sched = 0;
function at(beat, fn, audio = false) { events.push({ t: beat * BEAT, fn, audio }); }
function play(list) { events = list.sort((a, b) => a.t - b.t); t0 = ac.currentTime + 0.15; }
setInterval(runEvents, 40);          // the scheduler runs on a timer, not on animation frames
function runEvents() {
  if (!ac || !events.length) return;
  const now = ac.currentTime;
  while (events.length && t0 + events[0].t < now + 0.25) {
    const e = events.shift(), when = t0 + e.t;
    if (e.audio) e.fn(when);
    else setTimeout(e.fn, Math.max(0, (when - now) * 1000));
  }
}
function song() {
  events = [];
  const fx = (b, fn) => at(b, fn), au = (b, fn) => at(b, fn, true);
  // intro: snow gathers into a tree
  fx(0, () => { morph('tree', 5.5, { fromSnow: true }); caption('Twenty-four days.', 4200); });
  au(0, t => { bass(36, t, 0.12); [72, 76, 79, 84].forEach((m, i) => bell(m + 12, t + i * 0.3, 0.05)); });
  au(3, t => [74, 79, 83, 86].forEach((m, i) => bell(m + 12, t + i * 0.3, 0.04)));
  const S = 6;
  for (let pass = 0; pass < 2; pass++) {
    const P = S + pass * 48;
    BARS.forEach((c, b) => {
      const ch = CH[c], bt = P + b * 3;
      au(bt, t => { bass(ch[0] - 12, t); padOscs.forEach((o, k) => o.frequency.setValueAtTime(mtof(ch[k % 3] + 12), t)); padF.frequency.setTargetAtTime(pass ? 1400 : 700, t, 0.5); });
      au(bt + 1, t => { pluck(ch[1] + 12, t); pluck(ch[2] + 12, t); });
      au(bt + 2, t => { pluck(ch[1] + 12, t); pluck(ch[2] + 12, t); });
      if (pass) au(bt, t => bell(ch[0] + 36, t, 0.035));
    });
    for (const [b, d, m] of MEL) {
      au(P + b, t => { box(m, t); if (pass) box(m + 12, t, 0.05); });
      fx(P + b, () => { U.uBeat.value = 1; });
    }
  }
  // pass 1: an ornament for every beat (24 beats, 24 days)
  for (let k = 0; k < 24; k++) {
    fx(S + k, () => pop(k));
    au(S + k, t => bell(96 + [0, 2, 4, 7, 9][k % 5] + (k % 10 > 4 ? 12 : 0) - 12, t, 0.025));
  }
  fx(S + 24, () => caption('Every ornament is a door.', 4000));
  fx(S + 48, () => caption('Click any one to visit its day.', 4500));
  fx(S + 48 + 42, () => { starOn(); caption('Merry Christmas.', 5000); });
  au(S + 48 + 42, t => { [84, 88, 91, 96].forEach((m, i) => bell(m, t + i * 0.08, 0.06)); noiseBurst(t, 1.5, 0.06, 6000, 2000); });
  fx(S + 96, () => finale());
  play(events);
}

// ---------- finale ----------
let finaleOn = false;
function finale() {
  if (finaleOn) return; finaleOn = true;
  $('fin').disabled = true; $('again').disabled = true;
  const base = ac ? (ac.currentTime - t0) / BEAT : 0;
  events = [];                                          // drop whatever was left of the song
  const fx = (s, fn) => at(base + s / BEAT, fn), au = (s, fn) => at(base + s / BEAT, fn, true);
  fx(0, () => { hideOrnaments(); morph('burst', 1.4); flash(1); });
  au(0, t => { bass(24, t, 0.3); noiseBurst(t, 0.8, 0.35, 2000, 200); for (let k = 0; k < 40; k++) noiseBurst(t + 0.3 + R() * 2.2, 0.05, 0.08, 4000 + R() * 4000, 3000); [79, 84, 88].forEach((m, i) => bell(m + 12, t + 0.2 + i * 0.15, 0.05)); });
  fx(3.6, () => morph('star', 2.4));
  au(3.6, t => { bass(36, t); [72, 76, 79, 84, 88].forEach((m, i) => bell(m, t + i * 0.12, 0.06)); });
  fx(7.6, () => morph('flake', 2.4));
  au(7.6, t => { bass(33, t); [69, 72, 76, 81, 84].forEach((m, i) => bell(m, t + i * 0.12, 0.06)); });
  fx(11.6, () => { morph('text', 2.6); flash(0.6); });
  au(11.6, t => {
    bass(29, t); [65, 69, 72, 77].forEach((m, i) => box(m + 12, t + i * 0.1, 0.1));
    bass(31, t + 1.8); [67, 71, 74, 79].forEach((m, i) => box(m + 12, t + 1.8 + i * 0.1, 0.1));
    bass(24, t + 3.6, 0.2); [72, 76, 79, 84, 88].forEach((m, i) => { box(m, t + 3.6 + i * 0.12, 0.12); bell(m + 12, t + 3.6 + i * 0.12, 0.04); });
  });
  fx(18.5, () => morph('snow', 3.5));
  fx(23, () => morph('tree', 5, { fromSnow: true }));
  au(23, t => MEL.slice(0, 9).forEach(([b, d, m]) => box(m, t + b * BEAT, 0.12)));
  fx(28.5, () => { starOn(); orns.forEach((o, k) => setTimeout(() => pop(k), k * 70)); caption('Click any ornament to revisit its day.', 6000); });
  au(28.5, t => { for (let k = 0; k < 24; k++) bell(84 + [0, 2, 4, 7, 9][k % 5] + 12 * Math.floor(k / 10), t + k * 0.07, 0.025); });
  fx(30, () => { finaleOn = false; $('fin').disabled = false; $('again').disabled = false; });
  events.sort((a, b) => a.t - b.t);
}

function pop(k) { const o = orns[k]; o.userData.target = 1; o.userData.s = Math.max(o.userData.s, 0.001); o.userData.flash = 1; }
function hideOrnaments() { for (const o of orns) o.userData.target = 0; U.uStarK.value = 0.12; starLit = false; }
let starLit = false;
function starOn() { starLit = true; flash(0.8); }
let flashV = 0; function flash(v) { flashV = Math.max(flashV, v); }
function caption(s, ms) { const c = $('cap'); c.textContent = s; c.style.opacity = 1; clearTimeout(caption.h); caption.h = setTimeout(() => c.style.opacity = 0, ms); }

// ---------- interaction ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let drag = null, spinV = 0.12, hover = null, moved = 0;
renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX }; moved = 0; });
addEventListener('pointerup', e => {
  if (drag && moved < 6) {
    pick(e);
    if (hover && hover.userData.day) { location.href = `../${String(hover.userData.day).padStart(2, '0')}/`; }
    else if (hover === starHit && started && !finaleOn) finale();
  }
  drag = null;
});
addEventListener('pointermove', e => {
  if (drag) { const dx = e.clientX - drag.x; drag.x = e.clientX; moved += Math.abs(dx); group.rotation.y += dx * 0.006; spinV = dx * 0.006 * 60; }
  pick(e);
});
function pick(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const vis = orns.filter(o => o.userData.s > 0.5);
  const hit = ray.intersectObjects(started && cur === 'tree' ? [...vis, starHit] : [], false)[0];
  hover = hit ? hit.object : null;
  const tip = $('tip');
  if (hover && hover.userData.day) {
    const d = hover.userData.day;
    tip.innerHTML = `<b>Day ${d}</b> · ${DAYS[d]}<small>${hover.userData.lit ? 'click to open it again' : "you haven't opened this one yet"}</small>`;
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.opacity = 1;
    renderer.domElement.style.cursor = 'pointer';
  } else if (hover === starHit) {
    tip.innerHTML = '<b>The Star</b><small>click for the finale</small>'; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.opacity = finaleOn ? 0 : 1;
    renderer.domElement.style.cursor = 'pointer';
  } else { tip.style.opacity = 0; renderer.domElement.style.cursor = drag ? 'grabbing' : 'grab'; }
}

let started = false;
$('go').onclick = () => {
  initAudio(); started = true;
  $('start').style.opacity = 0; setTimeout(() => $('start').remove(), 1000);
  song();
  setTimeout(() => { if (!finaleOn) $('fin').disabled = false; $('again').disabled = false; }, 8000);
};
$('fin').onclick = () => finale();
$('again').onclick = () => {
  if (finaleOn) return;
  hideOrnaments(); morph('snow', 2.5);
  setTimeout(() => song(), 2600);
};
$('mus').onclick = () => {
  musicOn = !musicOn; $('mus').textContent = musicOn ? '🎵 Music: on' : '🎵 Music: off';
  if (master) master.gain.setTargetAtTime(musicOn ? 0.8 : 0, ac.currentTime, 0.1);
};

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  U.uTime.value += dt;
  U.uMorph.value = Math.min(1, (performance.now() - mt.start) / 1000 / mt.dur);   // real time, so it stays in step with the music
  U.uTree.value += ((cur === 'tree' ? 1 : 0) - U.uTree.value) * Math.min(1, dt * 2);
  U.uStarK.value += ((starLit ? 1.4 : 0.12) - U.uStarK.value) * Math.min(1, dt * 1.5);
  U.uBeat.value = Math.max(0, U.uBeat.value - dt * 3);
  // spin the tree; square up to face the camera for the star, the snowflake and the words
  if (cur === 'tree' || cur === 'snow') { if (!drag) { spinV += (0.12 - spinV) * Math.min(1, dt * 0.8); group.rotation.y += spinV * dt; } }
  else { const tgt = Math.round(group.rotation.y / (Math.PI * 2)) * Math.PI * 2; group.rotation.y += (tgt - group.rotation.y) * Math.min(1, dt * 2.5); }
  for (const o of orns) {
    const u = o.userData;
    u.s += ((u.target * (o === hover ? 1.45 : 1)) - u.s) * Math.min(1, dt * (u.target ? 9 : 5));
    const wob = u.flash ? 1 + Math.sin((1 - u.flash) * 12) * u.flash * 0.35 : 1;
    o.scale.setScalar(Math.max(0.0001, u.s * wob));
    u.flash = Math.max(0, (u.flash || 0) - dt * 1.6);
    o.material.emissiveIntensity = u.base + (u.flash || 0) * 2 + (o === hover ? 0.8 : 0) + (u.lit ? Math.sin(U.uTime.value * 2 + u.day) * 0.15 : 0);
  }
  bloom.strength = 0.9 + flashV * 1.2; flashV = Math.max(0, flashV - dt * 0.8);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.dbg = { morph, finale, song, U, orns, pop, starOn, composer, get cur() { return cur; }, SHAPES, mt, events: () => events };
</script>
</body>
