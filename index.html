<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Advent 2026</title>
<style>
  :root { --bg:#070b1a; --ink:#eef3ff; --dim:#8b97b8; --gold:#ffcf6e; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { min-height:100vh; background:radial-gradient(ellipse at 50% -10%, #1d2b5c 0%, var(--bg) 60%); overflow-x:hidden; }
  #snow { position:fixed; inset:0; pointer-events:none; z-index:0; }
  header { position:relative; z-index:1; text-align:center; padding:40px 16px 10px; }
  h1 { margin:0; font-size:clamp(2rem,6vw,3.6rem); letter-spacing:.04em; font-weight:800;
       background:linear-gradient(180deg,#fff 30%,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
       filter:drop-shadow(0 0 18px rgba(255,207,110,.35)); }
  .sub { color:var(--dim); margin-top:8px; font-size:1rem; }
  #peekbar { display:none; margin:12px auto 0; width:max-content; max-width:90%; font-size:.8rem; color:#111; background:var(--gold); padding:4px 12px; border-radius:99px; }
  main { position:relative; z-index:1; max-width:980px; margin:24px auto 60px; padding:0 16px;
         display:grid; grid-template-columns:repeat(5,1fr); gap:14px; grid-auto-flow:dense; }
  @media (max-width:640px) { main { grid-template-columns:repeat(3,1fr); gap:10px; } }
  .slot { position:relative; aspect-ratio:3/4; perspective:900px; border-radius:10px;
          background:radial-gradient(circle at 50% 45%, #2a1d05 0%, #0b0b0f 75%); box-shadow:inset 0 0 0 2px #00000080, 0 6px 18px #0008; }
  .slot.wide { grid-column:span 2; aspect-ratio:auto; }
  .slot.tall { grid-row:span 2; aspect-ratio:auto; }
  .inside { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
            padding:10px; gap:6px; border-radius:10px; overflow:hidden; color:var(--gold); }
  .inside .t { font-weight:700; font-size:.95rem; text-shadow:0 0 12px #ffb84d; }
  .inside .go { font-size:.75rem; color:var(--dim); }
  .inside::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, #ffcf6e33, transparent 65%); }
  .door { position:absolute; inset:0; border-radius:10px; transform-origin:left center; transition:transform .9s cubic-bezier(.3,1.4,.4,1);
          cursor:pointer; display:flex; align-items:center; justify-content:center; border:none; padding:0; color:#fff;
          font:800 clamp(1.6rem,4.5vw,2.6rem) system-ui,sans-serif; text-shadow:0 2px 0 #0006;
          box-shadow:inset 0 0 0 3px #ffffff22, inset 0 0 0 7px #00000022, 0 2px 6px #0007; backface-visibility:hidden; }
  .door::after { content:""; position:absolute; right:10%; top:50%; width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 6px var(--gold); }
  .door:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
  .slot.open .door { transform:rotateY(-108deg); }
  .slot.locked .door { cursor:not-allowed; filter:saturate(.55) brightness(.75); }
  .slot.today .door { animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:inset 0 0 0 3px #fff6, 0 0 26px 4px #ffcf6eaa; } }
  .slot.shake { animation:shake .4s; }
  @keyframes shake { 20%,60% { transform:translateX(-6px) } 40%,80% { transform:translateX(6px) } }
  #toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); opacity:0; transition:.3s; z-index:5;
           background:#111a33ee; border:1px solid #ffffff22; padding:10px 18px; border-radius:12px; font-size:.95rem; pointer-events:none; }
  #toast.on { opacity:1; transform:translateX(-50%); }
  footer { position:relative; z-index:1; text-align:center; color:var(--dim); font-size:.8rem; padding:0 16px 30px; }
  footer a { color:var(--dim); }
  @media (prefers-reduced-motion:reduce) { .door { transition:none } .slot.today .door { animation:none } }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<header>
  <h1>Code Advent 2026</h1>
  <div class="sub" id="sub"></div>
  <div id="peekbar">Peek mode is on: every door is unlocked. Add <code>?peek=0</code> to the URL to turn it off.</div>
</header>
<main id="grid"></main>
<div id="toast"></div>
<footer>25 small programs, one a day. Every one runs in your browser, with nothing to install.</footer>

<script>
// One entry per day. Titles only show once a door is open.
const DAYS = [
  null,
  'First Snow', 'Fairy Lights', 'No Two Alike', 'Hearth', 'Gift Within a Gift',
  'The Music Box', 'The Neural Painter', 'Light the Tree', 'Chimney Drop', 'Ornament Lathe',
  'Murmuration', 'Hot Cocoa', 'The Carol Machine', 'Reindeer Flight School', 'Bell Wave',
  'Snow Globe', 'Northern Lights', 'Bauble Selfie', 'Midnight Forest', 'A Million Snowflakes',
  "Santa's Route", 'The Snow Conductor', 'SLEIGH-OS', 'Gingerbread Gait', 'The Grand Tree'
];
const YEAR = 2026;
// Door order on the wall (shuffled like a real advent calendar), plus a few big doors.
const ORDER = [7,19,3,24,12, 15,1,22,9,17, 5,25,11,20,2, 13,8,18,4,23, 10,16,6,21,14];
const BIG = { 25:'wide tall', 24:'tall', 1:'wide' };
const COLORS = ['#b3202a','#1f6b3a','#1c3f8f','#8a1d5a','#a35a12','#13626b','#5a2a91'];

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

// Hidden override: ?peek (or ?peek=1) unlocks everything, ?peek=0 locks again.
// Typing "northpole" anywhere on the page does the same.
const q = new URLSearchParams(location.search);
if (q.has('peek')) q.get('peek') === '0' ? store.del('peek') : store.set('peek','1');
let peek = store.get('peek') === '1';

const now = new Date();
const unlockDate = d => new Date(YEAR, 11, d);
const isOpenable = d => peek || now >= unlockDate(d);
const opened = new Set(JSON.parse(store.get('opened') || '[]'));
const todayDay = (now.getFullYear() === YEAR && now.getMonth() === 11) ? now.getDate() : 0;

function sub() {
  const xmas = new Date(YEAR, 11, 25);
  const days = Math.ceil((xmas - now) / 864e5);
  document.getElementById('sub').textContent =
    days > 1 ? `${days} sleeps until Christmas. A new door opens every day from December 1.` :
    days === 1 ? 'One more sleep!' : 'Merry Christmas! Every door is open.';
  document.getElementById('peekbar').style.display = peek ? 'block' : 'none';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200);
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  ORDER.forEach((d, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot ' + (BIG[d] || '');
    if (!isOpenable(d)) slot.classList.add('locked');
    if (opened.has(d) && isOpenable(d)) slot.classList.add('open');
    if (d === todayDay) slot.classList.add('today');
    const href = `days/${String(d).padStart(2,'0')}/`;
    slot.innerHTML = `
      <a class="inside" href="${href}" tabindex="-1"><span class="t">${DAYS[d]}</span><span class="go">Day ${d} · open ›</span></a>
      <button class="door" aria-label="Day ${d}" style="background:
        repeating-linear-gradient(45deg,#ffffff0d 0 6px,transparent 6px 14px), ${COLORS[i % COLORS.length]}">${d}</button>`;
    slot.querySelector('.door').onclick = () => {
      if (!isOpenable(d)) {
        slot.classList.remove('shake'); void slot.offsetWidth; slot.classList.add('shake');
        const n = Math.ceil((unlockDate(d) - now) / 864e5);
        return toast(`Day ${d} opens on December ${d}, ${n} day${n === 1 ? '' : 's'} from now.`);
      }
      slot.classList.add('open');
      opened.add(d); store.set('opened', JSON.stringify([...opened]));
      setTimeout(() => location.href = href, 950);
    };
    grid.appendChild(slot);
  });
  sub();
}

// Secret word: type "northpole" anywhere to toggle peek mode.
let typed = '';
addEventListener('keydown', e => {
  typed = (typed + e.key.toLowerCase()).slice(-9);
  if (typed === 'northpole') {
    peek = !peek; peek ? store.set('peek','1') : store.del('peek');
    toast(peek ? 'Peek mode on. Every door is unlocked.' : 'Peek mode off.');
    render();
  }
});

render();

// Background snow
const c = document.getElementById('snow'), x = c.getContext('2d');
let W, H, flakes = [];
function size() { W = c.width = innerWidth; H = c.height = innerHeight;
  flakes = Array.from({length: Math.round(W * H / 9000)}, () => ({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*2+.4, s:Math.random()*.6+.2, p:Math.random()*6 })); }
size(); addEventListener('resize', size);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function tick(t) {
  x.clearRect(0,0,W,H); x.fillStyle = '#fff';
  for (const f of flakes) {
    if (!still) { f.y += f.s * f.r; f.x += Math.sin(t/1500 + f.p) * .3; if (f.y > H) { f.y = -4; f.x = Math.random()*W; } }
    x.globalAlpha = .25 + f.r / 4; x.beginPath(); x.arc(f.x, f.y, f.r, 0, 7); x.fill();
  }
  requestAnimationFrame(tick);
})(0);
</script>
</body>
</html>
